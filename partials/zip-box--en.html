<!-- shared:zip-{{PLACEMENT}} -->
<div class="zbx" data-target="/?zip=" data-site="mc" data-lang="en">
  <p class="zbx-title">Compare 2027 plans in your county</p>
  <form class="zbx-form">
    <input type="tel" inputmode="numeric" maxlength="5" autocomplete="postal-code" class="zbx-input" placeholder="e.g. 90230" aria-label="Compare 2027 plans in your county">
    <button type="submit" class="zbx-btn" data-cta="zip_{{PLACEMENT}}">See my plans</button>
  </form>
  <p class="zbx-error">Enter 5 digits</p>
</div>
<!-- /shared:zip-{{PLACEMENT}} -->

    if (LIST) { if (!d.ok || !d.html || !d.css) { fail(); return; } try { renderList(d); } catch (err) { fail(); } return; }
    if (!d.ok || !d.plans.length) { fail(); return; }
    render(d);
  });
  frame.addEventListener('load', function(){
    try {
      frame.contentWindow.postMessage(LIST
        ? {type:'widget-plans', rid:rid, zip:ZIP, f:LF, o:LO, a:LA, list:true}
        : {type:'widget-plans', rid:rid, zip:ZIP, ids:IDS, r:PRI}, WIDGET_HOST);
    } catch (err) { fail(); }
  });
  frame.src = WIDGET_HOST + '/widget-v4.html?data=1&theme=california&lang=' + (EN ? 'en' : 'es');

  function cell(v, isSug){
    var sg = isSug ? ' sug' : '';
    if (!v) return '<div class="v off' + sg + '">' + (EN ? 'No information' : 'Sin información') + '</div>';
    var t = String(v.t);
    var zero = !v.off && /^\$0(\.00)?($|\/| )/.test(t.replace(/<[^>]+>/g, '').trim());
    return '<div class="v' + (v.off ? ' off' : (zero ? ' z' : '')) + sg + '">' + t + '</div>';
  }
  function rowHTML(key, plans, sugId){
    var any = plans.some(function(p){ return p.rows[key]; });
    if (!any) return '';
    return '<div class="row"><div class="rl">' + esc(T.rows[key]) + '</div>' +
      plans.map(function(p){ return cell(p.rows[key], sugId && p.id === sugId); }).join('') + '</div>';
  }
  function secHTML(icon, label){
    return '<div class="sec"><svg class="si" viewBox="0 0 24 24">' + PIC[icon] + '</svg>' + esc(label) + '</div>';
  }
  function callRow(icon, text){
    return '<div class="row"><div class="rl"></div><div class="callrow">' +
      '<svg class="cri" viewBox="0 0 24 24">' + PIC[icon] + '</svg><span>' + esc(text) +
      '<b><a href="tel:+13105979142" style="color:inherit;text-decoration:none">' + TEL + '</a></b></span></div></div>';
  }

  function render(d){
    var plans = d.plans, n = plans.length;
    var sug = d.sug;
    var when = new Date().toLocaleDateString(EN ? 'en-US' : 'es-ES',
      {day:'numeric', month:'short', year:'numeric'});
    // T-138: the place is the CITY (d.city, from plansForShare), never the bare ZIP/state pair.
    var place = placeText(ZIP, d.city);
    document.title = n + ' ' + T.title + ' | ' + place + ' | Medicare California';

    var cols = '<div class="blank"></div>' + plans.map(function(p){
      var stars = p.stars == null ? '' : '<span>★ ' + p.stars + (EN ? ' of 5' : ' de 5') + '</span>';
      return '<div class="col' + (sug && sug.id === p.id ? ' sug' : '') + '" style="--c:' + esc(p.color) + '">' +
        '<div class="car">' + esc(p.carrier) + '</div>' +
        '<div class="pn">' + esc(p.name) + '</div>' +
        '<div class="id"><span class="ty">' + esc(p.type) + ' ·</span> <span class="pid">' +
          esc(p.id) + '</span> ' + stars + '</div>' +
        (sug && sug.id === p.id
          ? '<span class="sgc dk">' + esc(T.sug) + '</span><span class="sgc ph">' + esc(T.sugShort) + '</span>'
          : '') +
      '</div>';
    }).join('');

    var sugId = sug ? sug.id : '';
    var table =
      secHTML('cost', T.costs) +
      rowHTML('premium', plans, sugId) + rowHTML('giveback', plans, sugId) + rowHTML('moop', plans, sugId) + rowHTML('mded', plans, sugId) +
      secHTML('visits', T.doctor) +
      rowHTML('pcp', plans, sugId) + rowHTML('spec', plans, sugId) + callRow('visits', T.docCall) +
      secHTML('hosp', T.hosp) +
      rowHTML('hosp', plans, sugId) + rowHTML('er', plans, sugId) + rowHTML('amb', plans, sugId) + rowHTML('wwe', plans, sugId) +
      secHTML('drug', T.drugs) +
      rowHTML('ded', plans, sugId) + rowHTML('tiers', plans, sugId) + callRow('drug', T.rxCall) +
      secHTML('star', T.extras) +
      rowHTML('dental', plans, sugId) + rowHTML('vision', plans, sugId) + rowHTML('hearing', plans, sugId) +
      rowHTML('otc', plans, sugId) + rowHTML('trans', plans, sugId);

    var sugLine = sug
      ? '<div class="pick2"><div><b class="sgt">' + esc(T.sug) + ': ' + esc(sug.name) + '.</b> ' +
        esc([sug.lead, sug.why].filter(Boolean).join(' ')) + '</div></div>'
      : '';

    document.getElementById('out').innerHTML =
      '<div class="sheet">' +
        '<div class="hdr2">' +
          '<div class="logo2"><a href="/" aria-label="Medicare California home" ' +
            'style="display:inline-block;text-decoration:none">' + LOGO + '</a></div><div class="sep2"></div>' +
          '<div class="who2"><img src="' + IMGBASE + 'images/alejandra-headshot.jpg" alt="Alejandra Brizuela" width="46" height="46">' +
            '<div><div class="lab2">' + esc(T.adv) + '</div><div class="nm2">Alejandra Brizuela</div>' +
            '<div class="em2"><a href="mailto:alejandra@medicare-california.com" style="color:inherit;text-decoration:none">Alejandra@Medicare-California.com</a></div></div></div>' +
          '<div class="sep2"></div>' +
          '<div class="call2"><div class="lab2">' + esc(T.call) + '</div>' +
            '<div class="ph2"><a href="tel:+13105979142" style="color:inherit;text-decoration:none">' + TEL + '</a></div></div>' +
        '</div>' +
        '<div class="band2"><h1>' + n + ' ' + esc(T.title) + ' <em>' + placePill(ZIP, d.city) + '</em></h1>' +
          '<div class="dl"><span class="gold">' + T.before + '</span>' +
            '<span class="plain">' + esc(T.start) + '</span></div></div>' +
        sugLine +
        '<div class="grid" style="--n:' + n + '">' + cols + table + '</div>' +
        '<div class="cta2"><div class="c2t">' + esc(T.q) + '</div>' +
          '<div class="c2p">' + esc(T.cw) + '<b>' + TEL + '</b></div>' +
          '<div class="c2w">Medicare-California.com</div></div>' +
        '<p class="disc">' + esc(T.disc) + ' ' + esc(T.sent) + esc(when) + '.</p>' +
      '</div>' +
      '<div class="fix"><a class="l" href="tel:+13105979142">' + esc(T.callb) + '</a>' +
        '<a class="w" href="https://wa.me/13105979142" target="_blank" rel="noopener">WhatsApp</a></div>';

    placeSugBox();
    if (window.gtag) window.gtag('event', 'shared_page_view', {plans:n, zip3:ZIP.slice(0,3), lang:EN?'en':'es'});
    if (PRINT) setTimeout(function(){
      // T-138 (8): the browser's Save-as-PDF defaults the file name to document.title -- place,
      // never the bare ZIP, first.
      document.title = place + ' - ' + (EN ? '2027 Plans' : 'Planes 2027') + ' - ' + when;
      window.print();
    }, 600);
  }

  // The bottom of the outline belongs to whichever value row happens to be last.
  function placeSugBox(){
    var cells = document.querySelectorAll('.v.sug');
    if (cells.length) cells[cells.length - 1].classList.add('vlast');
  }

  /* T-139: a shared LIST link, not a compare of specific ids -- shareRenderList (widget-v4.html,
     loaded from beneficiosmedicare per WIDGET_HOST above) re-applies the link's own filters/sort/
     carrier to this zip's live plans and hands back the widget's own plan-card markup, read-only, in
     a shadow root carrying the widget's own stylesheet (same reuse principle as beneficiosmedicare's
     opciones-compartidas.html: one card template, never a second copy for this page to drift from). */
  function part(host, css, html){
    var root = host.attachShadow({mode:'open'});
    root.innerHTML = '<style>' + css.replace(/:root\b/g, ':host') + ':host{display:block}</style>' + html;
    return root;
  }
  // The onclick on every card opens a detail screen that only exists inside the live, interactive
  // widget; this page shows the list read-only, so the dead handler and the "View details" link that
  // would do nothing are both removed rather than left looking tappable.
  function stripDeadCardLinks(html){
    return String(html || '')
      .replace(/\sonclick="cardTap\([^"]*\)"/g, '')
      .replace(/<div class="pc-det">[\s\S]*?<\/div>/g, '');
  }
  // T-139: "N [filter words] plans in CITY" / "N planes [filter words] en CITY" -- LT is the exact
  // plain words the sender's own results headline showed (typeNameWords + priorityNameWords,
  // widget-v4.html resultsTitlePlain), carried in the link so this page never recomputes it. English
  // puts the words BEFORE "plan(s)" ("8 HMO plans"), Spanish AFTER ("8 planes HMO") -- same order
  // resultsTitlePlain uses, not the same position in both languages.
  function listTitleBase(n){
    return LT ? (EN ? n + ' ' + LT + ' plan' + (n === 1 ? '' : 's') : n + ' plan' + (n === 1 ? '' : 'es') + ' ' + LT)
              : (EN ? n + ' plan' + (n === 1 ? '' : 's') : n + ' plan' + (n === 1 ? '' : 'es'));
  }
  function renderList(d){
    var n = d.n || 0;
    if (!n) { fail(); return; }
    var when = new Date().toLocaleDateString(EN ? 'en-US' : 'es-ES', {day:'numeric', month:'short', year:'numeric'});
    var place = placeText(ZIP, d.city);
    document.title = listTitleBase(n) + (EN ? ' in ' : ' en ') + place + ' | Medicare California';

    document.getElementById('out').innerHTML =
      '<div class="sheet">' +
        '<div class="hdr2">' +
          '<div class="logo2"><a href="/" aria-label="Medicare California home" ' +
            'style="display:inline-block;text-decoration:none">' + LOGO + '</a></div><div class="sep2"></div>' +
          '<div class="who2"><img src="' + IMGBASE + 'images/alejandra-headshot.jpg" alt="Alejandra Brizuela" width="46" height="46">' +
            '<div><div class="lab2">' + esc(T.adv) + '</div><div class="nm2">Alejandra Brizuela</div>' +
            '<div class="em2"><a href="mailto:alejandra@medicare-california.com" style="color:inherit;text-decoration:none">Alejandra@Medicare-California.com</a></div></div></div>' +
          '<div class="sep2"></div>' +
          '<div class="call2"><div class="lab2">' + esc(T.call) + '</div>' +
            '<div class="ph2"><a href="tel:+13105979142" style="color:inherit;text-decoration:none">' + TEL + '</a></div></div>' +
        '</div>' +
        '<div class="band2"><h1>' + esc(listTitleBase(n)) + ' <em>' + placePill(ZIP, d.city) + '</em></h1>' +
          '<div class="dl"><span class="gold">' + T.before + '</span>' +
            '<span class="plain">' + esc(T.start) + '</span></div></div>' +
        '<div class="listw" id="listA"></div>' +
        '<div class="cta2"><div class="c2t">' + esc(T.q) + '</div>' +
          '<div class="c2p">' + esc(T.cw) + '<b>' + TEL + '</b></div>' +
          '<div class="c2w">Medicare-California.com</div></div>' +
        '<p class="disc">' + esc(T.disc) + ' ' + esc(T.sent) + esc(when) + '.</p>' +
      '</div>' +
      '<div class="fix"><a class="l" href="tel:+13105979142">' + esc(T.callb) + '</a>' +
        '<a class="w" href="https://wa.me/13105979142" target="_blank" rel="noopener">WhatsApp</a></div>';

    part(document.getElementById('listA'), d.css, stripDeadCardLinks(d.html));
    if (window.gtag) window.gtag('event', 'list_share_view', {plans:n, zip3:ZIP.slice(0,3), lang:EN?'en':'es', share_id:SHARE_ID});
    if (PRINT) setTimeout(function(){
      document.title = place + ' - ' + (EN ? '2027 Plans' : 'Planes 2027') + ' - ' + when;
      window.print();
    }, 600);
  }

  var IMGBASE = '/';   // this site has its own copy of the headshot
  /* AMENDMENT A (T-139, AB 2026-10-25 17:25): "-California" (hyphen matches the real domain) +
     ".com" #5d6b78 600 appended, no gap before either -- viewBox/width widened to fit
     (370->378 / 250->255), nothing else about the mark changed. */
  var LOGO = '<svg viewBox="0 0 378 48" width="255" height="32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Medicare-California.com">' +
    '<defs><linearGradient id="shLogo" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#0080D4"/><stop offset="100%" style="stop-color:#0071BC"/></linearGradient></defs>' +
    '<path d="M23 2 L43 10 L43 26 C43 37 35 43 23 49 C11 43 3 37 3 26 L3 10 Z" fill="url(#shLogo)"/>' +
    '<path d="M200 272 C150 236 132 212 132 184 C132 160 150 144 172 144 C185 144 195 151 200 160 C205 151 215 144 228 144 C250 144 268 160 268 184 C268 212 250 236 200 272 Z" fill="#fff" transform="translate(23 26) scale(0.181) translate(-200 -208)"/>' +
    '<text y="34" font-family="\'Open Sans\',Arial,sans-serif">' +
      '<tspan x="54" font-size="26" font-weight="700" fill="#1a1a1a">Medicare</tspan>' +
      '<tspan font-size="26" font-weight="700" fill="#3D9BE9">-California</tspan>' +
      '<tspan font-size="26" font-weight="600" fill="#5d6b78">.com</tspan></text></svg>';
})();

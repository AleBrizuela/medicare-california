<!-- shared:zip-{{PLACEMENT}} -->
<div class="zbx" data-target="/es?zip=" data-site="mc" data-lang="es">
  <p class="zbx-title">Compare los planes 2027 de su condado</p>
  <form class="zbx-form">
    <input type="tel" inputmode="numeric" maxlength="5" autocomplete="postal-code" class="zbx-input" placeholder="Ej. 90230" aria-label="Compare los planes 2027 de su condado">
    <button type="submit" class="zbx-btn" data-cta="zip_{{PLACEMENT}}">Ver mis planes</button>
  </form>
  <p class="zbx-error">Escriba 5 números</p>
</div>
<!-- /shared:zip-{{PLACEMENT}} -->
